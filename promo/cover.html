<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Chef Hand-off for MDL3: Bilibili cover</title>
<style>
:root{--text:#e9f0fa;--muted:#8da3bf;--chef:#ffb224;--mdl:#38c8ff;--ok:#3ddc84;--warn:#ffd23f;--line:#2b3d5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1200px;overflow:hidden;background:#0a0e14}
body{font-family:"DejaVu Sans","WenQuanYi Zen Hei",sans-serif;color:var(--text)}
#c{position:absolute;left:0;top:0;width:1920px;height:1200px;overflow:hidden;
  background:radial-gradient(1000px 640px at 85% 8%,rgba(56,200,255,.22),transparent 62%),
             radial-gradient(900px 620px at 6% 98%,rgba(255,178,36,.20),transparent 60%),
             linear-gradient(165deg,#111b2b,#0a0e14)}
#g{position:absolute;inset:0;opacity:.55;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px}
.t{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap}
.chip{display:inline-block;padding:16px 40px;border-radius:999px;border:5px solid;font-size:56px;font-weight:700;margin:0 16px}
</style>
</head>
<body>
<div id="c"><div id="g"></div>
  <div class="t" style="top:92px;font-size:50px;color:var(--muted);font-weight:700"><span style="display:inline-block;width:20px;height:20px;background:var(--warn);margin-right:20px;transform:rotate(45deg)"></span>绝地潜兵 2 · MOD</div>
  <div class="t" style="top:180px;font-size:214px;font-weight:800;line-height:1.1"><span style="color:var(--chef)">Chef</span> <span style="color:var(--text);font-size:170px">×</span> <span style="color:var(--mdl)">MDL3</span></div>
  <div class="t" style="top:470px;font-size:200px;font-weight:800;line-height:1.15;color:var(--warn);text-shadow:0 0 60px rgba(255,210,63,.35)">终于能一起用</div>
  <div class="t" style="top:790px"><span class="chip" style="border-color:var(--chef);color:var(--chef)">HUDdle</span><span class="chip" style="border-color:var(--chef);color:var(--chef)">Treasure Radar</span><span class="chip" style="border-color:var(--mdl);color:var(--mdl)">BF5 击杀反馈</span></div>
  <div class="t" style="top:1020px;font-size:48px;color:var(--muted)">Chef Hand-off for MDL3 · MIT 开源 · <span style="color:var(--ok)">已实机测试</span></div>
</div>
<script>window.READY=true;</script>
</body>
</html>
